services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sakz
      POSTGRES_PASSWORD: sakz
      POSTGRES_DB: sakz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sakz:sakz@db:5432/sakz
      JWT_SECRET: ${JWT_SECRET:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      CORS_ORIGINS: http://localhost:3000
      INPROCESS_SCAN: "false"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://sakz:sakz@db:5432/sakz
      SCAN_PAIRS: BTCUSDT,ETHUSDT,SOLUSDT
      SCAN_TIMEFRAME: 15m
      SCAN_INTERVAL_SECS: "60"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
